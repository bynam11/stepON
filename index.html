<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>stepON</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 1. 메인 홈 화면 (접속 시 처음 보이는 곳) -->
  <div id="home-screen" class="screen active">
    <h1>stepON</h1>
    <p>원하는 단계를 선택하세요</p>

    <div class="menu-container">
      <button class="menu-btn" onclick="showScreen('first-floor')">
        <span class="step-title">1층</span>
        <span class="step-desc">만보기 (걸음 수 측정)</span>
      </button>

      <button class="menu-btn" onclick="showScreen('mid-floor')">
        <span class="step-title">중간층</span>
        <span class="step-desc">현재 운동량 & 상태</span>
      </button>

      <button class="menu-btn" onclick="showScreen('complete-floor')">
        <span class="step-title">완료</span>
        <span class="step-desc">최종 운동 결과 & 달성</span>
      </button>
    </div>
  </div>

  <!-- 2. 1층: 만보기 화면 -->
  <div id="first-floor" class="screen">
    <button class="back-btn" onclick="showScreen('home-screen')">← 홈으로</button>
    <h2>1층 - 만보기</h2>
    
    <!-- 기존 만보기 코드 입력 위치 -->
    <div class="step-counter-box">
      <p>현재 걸음 수</p>
      <h1 id="step-count">0</h1>
      <button id="start-btn">측정 시작</button>
    </div>
  </div>

  <!-- 3. 중간층: 현재 운동량 화면 -->
  <div id="mid-floor" class="screen">
    <button class="back-btn" onclick="showScreen('home-screen')">← 홈으로</button>
    <h2>중간층 - 현재 운동량</h2>
    
    <div class="status-box">
      <p>소모 칼로리: <span id="calories">0</span> kcal</p>
      <p>이동 거리: <span id="distance">0</span> km</p>
      <p>현재 진행률: <span id="progress">50%</span></p>
    </div>
  </div>

  <!-- 4. 완료 화면 -->
  <div id="complete-floor" class="screen">
    <button class="back-btn" onclick="showScreen('home-screen')">← 홈으로</button>
    <h2>목표 달성! 완료</h2>
    
    <div class="result-box">
      <p>🎉 축하합니다! 오늘 운동을 완료했습니다.</p>
      <button onclick="alert('수고하셨습니다!')">운동 종료</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
